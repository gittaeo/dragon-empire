<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dragon Empire · Sound Lab</title><style>body{font:16px system-ui;background:#111e25;color:#e4ebea;margin:0;padding:2rem}main{max-width:900px;margin:auto}p{color:#b4c5c7}#buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.7rem}button{color:#f4e5c4;background:#263e46;border:1px solid #bd9b67;border-radius:8px;padding:1rem;cursor:pointer;text-align:left}button:hover{background:#38545b}label{display:inline-flex;align-items:center;gap:.7rem;margin:1rem 1.5rem 1rem 0}#status{color:#f2c982}</style></head><body><main><h1>Dragon Empire · 사운드 테스트</h1><p>버튼을 눌러 각 효과음을 들어보세요. 처음 누를 때 브라우저 오디오가 활성화됩니다.</p><label>전체 음량 <input id="volume" type="range" min="0" max="1" step="0.05" value="0.7"></label><label><input id="mute" type="checkbox"> 음소거</label><label>거리 <input id="distance" type="range" min="0" max="300" value="0"><output id="dist">0 m</output></label><p id="status" aria-live="polite">대기 중</p><div id="buttons"></div><p><button id="ambience">배경 바람 시작</button> <button id="stop">배경 바람 정지</button></p></main><script type="module">import {createAudio,SOUND_NAMES} from './audio.js';const audio=createAudio();const $=s=>document.querySelector(s);for(const name of SOUND_NAMES){const b=document.createElement('button');b.textContent=name;b.addEventListener('click',()=>{$('#status').textContent=audio.play(name,{z:Number($('#distance').value)})?name+' 재생':name+' 재생 불가 (음소거 또는 재생 제한)'});$('#buttons').append(b)}$('#volume').oninput=e=>audio.setMaster(Number(e.target.value));$('#mute').onchange=e=>audio.mute(e.target.checked);$('#distance').oninput=e=>$('#dist').textContent=e.target.value+' m';$('#ambience').onclick=()=>audio.startAmbience(2);$('#stop').onclick=()=>audio.stopAmbience();</script></body></html>
