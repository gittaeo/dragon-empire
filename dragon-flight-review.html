<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>실사 드래곤 모델 검토</title><style>body{margin:0;background:#101b21;color:#fff;font:15px system-ui}canvas{display:block;width:100vw;height:100vh}.info{position:fixed;top:20px;left:24px;max-width:480px;background:#10202bd9;padding:18px 22px;border-radius:10px;pointer-events:none}.info h1{font-size:20px;margin:0 0 8px}.info p{line-height:1.6;margin:4px 0;color:#d6e2df}#status{color:#f4cb8e}</style><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/package/examples/jsm/"}}</script></head><body><div class="info"><h1>드래곤 날갯짓 실험</h1><p>드래그: 회전 · 휠: 확대/축소</p><p>정식 리깅이 아닌 정점 변형 실험입니다. 모델 손상 여부와 자연스러움을 확인하세요.</p><p id="status">모델 불러오는 중…</p></div><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const clock=new THREE.Clock();const flight={value:0};const scene=new THREE.Scene();scene.background=new THREE.Color(0x1a2d38);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,1000);camera.position.set(5,3,8);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd3eaff,0x5e4835,2));const light=new THREE.DirectionalLight(0xffe4bb,3);light.position.set(3,8,5);scene.add(light);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;new GLTFLoader().load('./concepts/realistic-dragon-review.glb',g=>{const model=g.scene;model.traverse(o=>{if(!o.isMesh)return;let mats=Array.isArray(o.material)?o.material:[o.material];for(const m of mats){m.onBeforeCompile=shader=>{shader.uniforms.flapTime=flight;shader.vertexShader=shader.vertexShader.replace("#include <common>","#include <common>\nuniform float flapTime;").replace("#include <begin_vertex>","#include <begin_vertex>\nfloat wing=smoothstep(0.13,0.36,abs(position.x)); transformed.y += wing * wing * sin(flapTime * 3.0) * 0.12;");};}});scene.add(model);const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),scale=6/Math.max(size.x,size.y,size.z);model.scale.setScalar(scale);model.position.copy(center.multiplyScalar(-scale));controls.target.set(0,0,0);camera.position.set(7,4,9);controls.update();document.querySelector('#status').textContent=`모델 로드 완료 · 애니메이션 클립 ${g.animations.length}개`;},undefined,()=>{document.querySelector('#status').textContent='모델을 불러오지 못했습니다.'});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{flight.value=clock.getElapsedTime();controls.update();renderer.render(scene,camera)});
</script></body></html>
